name: Generate 1 MB patch test

on:
  push:
    paths:
      - '.github/workflows/generate-1mb-patch.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact 1 MiB patch file
        shell: python
        run: |
          from pathlib import Path
          target = 1024 * 1024
          header = (
              'From 0000000000000000000000000000000000000000 Mon Sep 17 00:00:00 2001\n'
              'Subject: [PATCH] Exact 1 MiB GitHub connector test\n\n'
              'diff --git a/generated.txt b/generated.txt\n'
              '--- /dev/null\n'
              '+++ b/generated.txt\n'
              '@@ -0,0 +1 @@\n'
              '+'
          ).encode('ascii')
          footer = b'\n-- \n2.50.0\n'
          payload = header + (b'A' * (target - len(header) - len(footer))) + footer
          assert len(payload) == target
          Path('github-plugin-1MiB-test.patch').write_bytes(payload)
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-plugin-1MiB-test.patch
          git commit -m "test: add exact 1 MiB patch file"
          git push
