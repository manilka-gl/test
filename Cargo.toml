[package]
name = "rust-ntfy"
version = "0.1.0"
edition = "2024"
description = "A lightweight native ntfy client for Windows"
license = "MIT"
repository = "https://github.com/manilka-gl/test"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.8"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
